name: sync-fork
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM: "yetone/magpie"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync default branch (fast-forward only)
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --prune
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "upstream/main" HEAD; then
            echo "already up to date"
            exit 0
          fi
          git merge --ff-only "upstream/main"
          git push origin "HEAD:main"

      - name: Sync other branches and tags
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' --prune
          git push origin 'refs/remotes/upstream/*:refs/heads/*' --prune
          git push origin --tags
