name: sync-fork
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM: "yetone/magpie"
  BRANCH: "main"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync default branch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream --prune
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "upstream/${BRANCH}" HEAD; then
            echo "already up to date"
            exit 0
          fi

          if git merge --ff-only "upstream/${BRANCH}"; then
            echo "fast-forwarded"
            git push origin "HEAD:${BRANCH}"
            exit 0
          fi

          echo "fork is ahead of upstream, replaying local commits on top of upstream"
          git rebase "upstream/${BRANCH}"
          git push --force-with-lease origin "HEAD:${BRANCH}"

      # GITHUB_TOKEN cannot push changes under .github/workflows/ (GitHub App
      # `workflows` permission is not grantable to GITHUB_TOKEN), so branches
      # whose tip touches a workflow file are reported as blocked, not failed.
      - name: Sync other branches
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' --prune
          ok=0; blocked=0
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/upstream/); do
            name="${ref#refs/remotes/upstream/}"
            [ "$name" = "${BRANCH}" ] && continue
            [ "$name" = "HEAD" ] && continue
            git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null || { echo "skip ${name} (no such ref)"; continue; }
            if git push origin "${ref}:refs/heads/${name}"; then
              ok=$((ok + 1))
            else
              blocked=$((blocked + 1)); echo "blocked ${name}"
            fi
          done
          echo "branches mirrored=${ok} blocked=${blocked}"

      - name: Sync tags
        continue-on-error: true
        run: |
          set -uo pipefail
          git fetch upstream --tags --prune || true
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##; s/\^{}$//' | sort -u > /tmp/have.txt
          git tag | sort -u > /tmp/all.txt
          comm -23 /tmp/all.txt /tmp/have.txt > /tmp/missing.txt
          echo "upstream-tags=$(wc -l < /tmp/all.txt) present=$(wc -l < /tmp/have.txt) missing=$(wc -l < /tmp/missing.txt)"
          mapfile -t miss < /tmp/missing.txt
          i=0
          while [ $i -lt ${#miss[@]} ]; do
            chunk=("${miss[@]:i:30}")
            refs=()
            for t in "${chunk[@]}"; do refs+=("refs/tags/${t}"); done
            if ! git push --quiet origin "${refs[@]}"; then
              sleep 2
              git push --quiet origin "${refs[@]}" || echo "chunk at ${i}: still rejected, will retry next run"
            fi
            i=$((i + 30))
          done
